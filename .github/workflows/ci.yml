name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      IMAP_PLUGIN_TEST_MODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-runtime.lock -r requirements-dev.lock
      - name: Privacy scan
        run: python scripts/privacy_scan.py .
      - name: Git history privacy scan
        run: python scripts/git_history_privacy_scan.py .
      - name: Tests
        run: python -m pytest tests
      - name: Validate plugin and skill structure
        run: python scripts/validate_structure.py
      - name: Validate macOS shell entrypoints
        if: runner.os == 'macOS'
        run: sh -n scripts/install_macos.sh scripts/uninstall_macos.sh scripts/launch_macos.sh scripts/setup_macos.sh scripts/doctor_macos.sh
