name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      IMAP_PLUGIN_TEST_MODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-runtime.lock -r requirements-dev.lock
      - name: Privacy scan
        run: python scripts/privacy_scan.py .
      - name: Tests
        run: python -m pytest tests
      - name: Validate plugin and skill structure
        run: python scripts/validate_structure.py
      - name: Validate macOS shell entrypoints
        if: runner.os == 'macOS'
        run: sh -n scripts/install_macos.sh scripts/uninstall_macos.sh scripts/launch_macos.sh scripts/setup_macos.sh scripts/doctor_macos.sh
