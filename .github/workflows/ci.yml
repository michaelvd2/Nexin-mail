name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-x64
          - os: macos-15
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    env:
      IMAP_PLUGIN_TEST_MODE: "1"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test dependencies
        run: >-
          python -m pip install --disable-pip-version-check --only-binary=:all:
          --require-hashes -r requirements-runtime.lock -r requirements-dev.lock
      - name: Privacy scan
        run: python scripts/privacy_scan.py .
      - name: Git history privacy scan
        run: python scripts/git_history_privacy_scan.py .
      - name: Tests
        run: python -m pytest tests
      - name: Validate plugin and skill structure
        run: python scripts/validate_structure.py
      - name: Validate macOS shell entrypoints
        if: runner.os == 'macOS'
        run: sh -n scripts/install_macos.sh scripts/uninstall_macos.sh scripts/install_nexin_mail_macos.sh scripts/uninstall_nexin_mail_macos.sh scripts/launch_macos.sh scripts/setup_macos.sh scripts/doctor_macos.sh nexin-mail/install_macos.sh nexin-mail/uninstall_macos.sh scripts/install_from_release.sh
      - name: Build the self-contained Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/build_runtime.ps1
      - name: Assemble and import-check Nexin Mail on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $result = python -m nexin_mail.build --source . --runtime runtime/python --output "${{ runner.temp }}/nexin-mail-windows-0.2.0" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Nexin Mail package assembly failed.' }
          if (-not (Test-Path -LiteralPath $result.archive -PathType Leaf)) { throw 'The built archive is missing.' }
          "NEXIN_MAIL_ARCHIVE=$($result.archive)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Validate local release metadata on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/release_check.py "$env:NEXIN_MAIL_ARCHIVE"
      - name: Run installation harness readiness checks on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @('scripts/windows_policy_harness.ps1', 'scripts/windows_credential_harness.ps1', 'scripts/install_from_release.ps1')
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path -LiteralPath $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "PowerShell syntax error in $file" }
          }
          python scripts/native_install_harness.py
          python scripts/loopback_imaps_harness.py --bind
          python scripts/windows_credential_harness.py
      - name: Build and relocate the native macOS package
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          mkdir "${{ runner.temp }}/macos-build"
          python scripts/build_macos_package.py --source . --artifact-root "${{ runner.temp }}/macos-build" > "${{ runner.temp }}/macos-result.json"
          archive=$(python -c 'import json,sys; print(json.load(open(sys.argv[1]))["package_archive"]["path"])' "${{ runner.temp }}/macos-result.json")
          python scripts/verify_macos_package.py "$archive" --extract-root "${{ runner.temp }}/macos-relocated"
          echo "NEXIN_MAIL_ARCHIVE=$archive" >> "$GITHUB_ENV"
      - name: Preserve release metadata
        shell: bash
        run: >-
          python -m scripts.prepare_release_assets
          --archive "$NEXIN_MAIL_ARCHIVE"
          --platform "${{ matrix.platform }}"
          --output "${{ runner.temp }}/nexin-mail-release"
          --commit "${{ github.sha }}"
          --build-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Upload verified platform release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nexin-mail-${{ matrix.platform }}
          path: ${{ runner.temp }}/nexin-mail-release/*
          if-no-files-found: error
          retention-days: 30
