[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imap-plugin"
version = "0.1.0"
description = "Local-first provider-independent IMAP/SMTP connector for Codex on Windows and macOS"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = ["mcp==2.1.1"]

[project.scripts]
imap-plugin = "imap_plugin.server:main"
imap-plugin-doctor = "imap_plugin.cli:doctor"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
